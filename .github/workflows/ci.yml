name: Build & test

# Runs the server tests, builds an installable Android APK and checks the iOS app compiles.
# Set the repository variable GATEPASS_SERVER_URL (Settings → Secrets and variables → Actions → Variables)
# to your society's server address so the apps connect to it.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server address baked into the apps (e.g. https://gate.yoursociety.in)'
        required: false

env:
  GATEPASS_SERVER_URL: ${{ inputs.server_url || vars.GATEPASS_SERVER_URL || 'https://gate.example.org' }}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build:mobile
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gatepass-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:mobile
      - name: Build for iOS Simulator (unsigned compile check)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
