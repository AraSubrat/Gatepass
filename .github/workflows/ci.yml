name: Build & test

# Runs the server tests, builds an installable Android APK and checks the iOS app compiles.
# Set the repository variable GATEPASS_SERVER_URL (Settings → Secrets and variables → Actions → Variables)
# to your society's server address so the apps connect to it.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server address baked into the apps (e.g. https://gate.yoursociety.in)'
        required: false

env:
  GATEPASS_SERVER_URL: ${{ inputs.server_url || vars.GATEPASS_SERVER_URL || 'https://gate.example.org' }}

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'gatepass' }}
      # Ever-increasing version so each APK installs over the previous one.
      GATEPASS_VERSION_CODE: ${{ github.run_number }}
      GATEPASS_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build:mobile
      - name: Set up signing key
        id: key
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "name=gatepass-android" >> "$GITHUB_OUTPUT"
          else
            # No society key configured yet: sign with a throwaway key so the release build is still verified.
            # This APK can't be updated by later builds, so don't give it to residents.
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. Building with a throwaway TEST key; see README → Signing key."
            export ANDROID_KEYSTORE_PASSWORD=test-only-password ANDROID_KEY_ALIAS=gatepass
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$ks" -alias gatepass -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -dname "CN=Test key"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "name=gatepass-android-TEST-KEY-do-not-distribute" >> "$GITHUB_OUTPUT"
          fi
          echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | grep -i "SHA-256"
          mkdir -p dist && cp "$apk" dist/gatepass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.name }}
          path: dist/gatepass.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:mobile
      - name: Build for iOS Simulator (unsigned compile check)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
