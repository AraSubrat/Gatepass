apply plugin: 'com.android.application'

// ---- Release signing ----
// Every release of the app MUST be signed with the same key, or phones refuse to install updates.
// The key is read from (first match wins):
//   1. environment variables (used by GitHub Actions): ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD,
//      ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
//   2. android/keystore.properties (for building on your own computer; never commit it):
//      storeFile=/full/path/to/gatepass-release.keystore
//      storePassword=...
//      keyAlias=gatepass
//      keyPassword=...
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String prop, String envName -> System.getenv(envName) ?: keystoreProps.getProperty(prop) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def hasReleaseKey = releaseStoreFile != null && file(releaseStoreFile).exists()

// Version: CI passes an ever-increasing number so each build installs over the previous one.
def appVersionCode = (System.getenv('GATEPASS_VERSION_CODE') ?: '1').toInteger()
def appVersionName = System.getenv('GATEPASS_VERSION_NAME') ?: '1.0'

android {
    namespace = "com.gatepass.society"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gatepass.society"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS') ?: 'gatepass'
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD') ?: signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('No release signing key found: the release APK will be unsigned. See android/app/build.gradle.')
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
